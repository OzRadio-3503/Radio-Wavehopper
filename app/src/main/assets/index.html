        const code = audio.error ? audio.error.code : null;
        const reason = MEDIA_ERROR_REASONS[code] || ('media error' + (code ? ' ' + code : ''));
        console.warn('[radio] audio element error:', reason, attempt.url);
        advance(reason);
      }, {once:true});
      audio.addEventListener('playing', () => { settled = true; onPlaying(); }, {once:true});

      const p = audio.play();
      if (p && p.catch) p.catch(e => {
        console.warn('[radio] audio.play() rejected:', e && e.name, e && e.message);
      });
    }

    tryNext();
    currentPlayingStation = station;
  }

  playBtn.addEventListener('click', () => {
    if (!tunedStation) return;
    if (isPlaying && currentPlayingStation === tunedStation) {
      stopAudio();
      statusText.className = 'status-text';
      statusText.textContent = 'Paused. Press play to resume.';
    } else {
      playStation(tunedStation);
    }
  });

  // --- dial drag (snaps straight to the nearest station) ---
  // Works the same on the app's dial and, with Band Lock on, the real
  // band dial. Each station passed gives a light buzz. Hold your finger
  // still for a moment to magnify: the window shows a 6x close-up and the
  // dial moves 6 times slower under your finger, for picking between
  // stations that sit close together. Let go to return to normal.
  const ZOOM = 6, HOLD_MS = 380, HOLD_SLOP = 8;
  const dialLens = document.getElementById('dialLens');
  const lensTape = dialLens.querySelector('.lens-tape');
  const lensName = dialLens.querySelector('.lens-name');
  let drag = null;

  function freqFromClientX(clientX){
    const rect = ruler.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    return MIN + p * totalRange;
  }

  // What a dial covers and which stations sit on it.
  function dialSpec(kind, band){
    if (kind === 'std') {
      return { kind, band:'std', min:MIN, max:MAX, val:s => s.freq, list:byFreq.filter(allowed) };
    }
    const b = REAL_BANDS[band];
    return { kind, band, min:b.min, max:b.max, val:s => realBandFor(s).value,
             list:realBandStations(band).filter(s => allowed(s) && realBandFor(s).value != null) };
  }
  // Nearest station to a value; on a shared frequency, the first in order
  // (alphabetical on the real dial).
  function pickOn(spec, value){
    let best = null, gap = Infinity;
    spec.list.forEach(s => {
      const g = Math.abs(spec.val(s) - value);
      if (g < gap - 1e-9) { best = s; gap = g; }
    });
    return best;
  }
  function dragValue(x){
    const { spec, rect } = drag;
    const range = spec.max - spec.min;
    if (drag.zoom) {
      const v = drag.anchorVal + (x - drag.anchorX) / rect.width * range / ZOOM;
      return Math.min(spec.max, Math.max(spec.min, v));
    }
    return spec.min + Math.min(1, Math.max(0, (x - rect.left) / rect.width)) * range;
  }
  function dragTo(x){
    drag.lastX = x;
    const v = dragValue(x);
    drag.value = v;
    const s = pickOn(drag.spec, v);
    if (s && Math.abs(s.freq - currentFreq) > 0.001) { buzz(8); render(s.freq); }
    if (drag.zoom) renderLens();
  }

  // The close-up: ticks, station dots and the needle for the stretch of dial
  // around the finger, with the tuned station's name underneath.
  function renderLens(){
    const { spec } = drag;
    const span = (spec.max - spec.min) / ZOOM;
    const lo = drag.value - span / 2, hi = drag.value + span / 2;
    const at = v => ((v - lo) / span * 100) + '%';
    let html = '<div class="ruler-line"></div>';
    const tick = (v, major, label) => {
      html += `<div class="tick${major ? ' major' : ''}" style="left:${at(v)}"></div>`;
      if (label != null) html += `<div class="tick-label" style="left:${at(v)}">${label}</div>`;
    };
    if (spec.band === 'std' || spec.band === 'fm') {
      for (let t = Math.ceil(lo * 10); t <= Math.floor(hi * 10); t++) {
        const major = t % 5 === 0;
        tick(t / 10, major, major ? (t / 10).toFixed(1) : null);
      }
    } else if (spec.band === 'am') {
      for (let k = Math.ceil(lo / 10) * 10; k <= hi; k += 10) tick(k, k % 50 === 0, k % 50 === 0 ? k : null);
    } else {
      Object.keys(DAB_BLOCKS).forEach(block => {
        const v = DAB_BLOCKS[block];
        if (v >= lo && v <= hi) tick(v, true, block);
      });
    }
    const cur = nearestStation(currentFreq);
    spec.list.forEach(s => {
      const v = spec.val(s);
      if (v < lo || v > hi) return;
      html += `<div class="real-mark${s === cur ? ' active' : ''}" style="left:${at(v)}"></div>`;
    });
    if (cur && spec.list.includes(cur)) html += `<div class="needle" style="left:${at(spec.val(cur))}"></div>`;
    lensTape.innerHTML = html;
    const real = cur.real && cur.real !== 'DAB only' ? cur.real : (cur.dab ? 'DAB+ ' + cur.dab : cur.real);
    lensName.textContent = spec.band === 'std'
      ? `${cur.freq.toFixed(2)} · ${cur.name}` : `${real} · ${cur.name}`;
  }
  function enterZoom(){
    if (!drag || drag.zoom) return;
    drag.anchorX = drag.lastX;
    drag.anchorVal = drag.value;
    drag.zoom = true;
    dialLens.hidden = false;
    buzz(20);
    renderLens();
  }
  function startDrag(kind, el, e){
    const spec = dialSpec(kind, kind === 'real' ? shownView : null);
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { el, spec, rect:el.getBoundingClientRect(), startX:e.clientX, lastX:e.clientX, zoom:false, value:0 };
    drag.hold = setTimeout(enterZoom, HOLD_MS);
    dragTo(e.clientX);
  }
  function endDrag(){
    if (!drag) return;
    clearTimeout(drag.hold);
    drag = null;
    dialLens.hidden = true;
  }

  ruler.addEventListener('pointerdown', e => { e.preventDefault(); startDrag('std', ruler, e); });

  // The real dial. With real frequency on, touching it tunes the real
  // frequency along the band on screen (Band Lock is switched on for you)
  // and stops at each end. Tap the BAND lock to release it.
  realRuler.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!bandLock) {
      if (!showRealFreq) { startDrag('std', ruler, e); return; }
      // Real frequency is on: touching the real dial tunes the real
      // frequency. That is what Band Lock does, so switch it on for you.
      setBandLock(true);
      if (!bandLock) { startDrag('std', ruler, e); return; }
    }
    startDrag('real', realRuler, e);
  });
  [ruler, realRuler].forEach(el => {
    el.addEventListener('pointermove', e => {
      if (!drag || drag.el !== el) return;
      if (!drag.zoom && Math.abs(e.clientX - drag.startX) > HOLD_SLOP) clearTimeout(drag.hold);
      dragTo(e.clientX);
    });
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  });

  // The Internet panel (Band Lock on): stations evenly spaced, alphabetical.
  let draggingNet = false;
  function netDialTo(clientX){
    const list = realBandStations('net').filter(allowed);
    if (!list.length) return;
    const rect = streamDisplay.getBoundingClientRect();
    const pc = (clientX - rect.left) / rect.width * 100;
    const all = realBandStations('net');
    const p = Math.min(1, Math.max(0, (pc - NET_MARGIN) / (100 - 2 * NET_MARGIN)));
    const near = all[Math.round(p * (all.length - 1))];
    // nearest allowed by position
    let best = null, gap = Infinity;
    list.forEach(s => { const g = Math.abs(all.indexOf(s) - all.indexOf(near)); if (g < gap) { gap = g; best = s; } });
    if (best && Math.abs(best.freq - currentFreq) > 0.001) { buzz(8); render(best.freq); }
  }
  streamDisplay.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!bandLock) {
      if (!showRealFreq) { startDrag('std', ruler, e); return; }
      setBandLock(true);
      if (!bandLock) { startDrag('std', ruler, e); return; }
    }
    draggingNet = true;
    try { streamDisplay.setPointerCapture(e.pointerId); } catch (err) {}
    netDialTo(e.clientX);
  });
  streamDisplay.addEventListener('pointermove', e => { if (draggingNet) netDialTo(e.clientX); });
  streamDisplay.addEventListener('pointerup', () => { draggingNet = false; });
  streamDisplay.addEventListener('pointercancel', () => { draggingNet = false; });

  // --- arrow-button tuning + keyboard ---
  const prevStationBtn = document.getElementById('prevStationBtn');
  const nextStationBtn = document.getElementById('nextStationBtn');
  const TUNE_STEP = 0.1;

  // Wraps a frequency into [MIN, MAX] instead of clamping at the ends, so
  // stepping past 102.1 loops back to 87.5 and stepping back past 87.5
  // loops to 102.1 - matching how Android Auto's skip-next/skip-previous
  // already behaves (REPEAT_MODE_ALL over the full station list).
  function wrapFreq(freq){
    if (freq > MAX + 1e-9) return MIN;
    if (freq < MIN - 1e-9) return MAX;
    return Math.round(freq * 10) / 10; // avoid float drift (87.60000000000001 etc.)
  }

  // wrap: from the widget or notification, where a "bump" at the band's end
  // can't be seen - go round to the other end instead.
  function goToStationStep(step, wrap){
    if (showRealFreq) pendingRollDir = step;   // digits roll the way you're tuning
    if (bandLock) {
      let target = realStepTarget(step);
      if (!target && wrap) {
        const cur = nearestStation(currentFreq);
        const list = realBandAllowed(realBandFor(cur).band, cur);
        target = list.length > 1 ? list[step > 0 ? 0 : list.length - 1] : null;
      }
      if (!target) { bumpBandEnd(); return; }
      pendingRollDir = step;
      render(target.freq);
      return;
    }
    if (!showRealFreq) { freqReadout.classList.remove('flicker'); void freqReadout.offsetWidth; freqReadout.classList.add('flicker'); }
    render(seqStepTarget(step).freq);
  }

  // Tap = single step (decimal point by decimal point, as before). Press
  // and hold = skip through frequencies like a traditional radio tuner,
  // speeding up the longer it's held, settling — and only then actually
  // tuning in and playing — on whatever frequency you release on.
  function bindHoldTune(btn, direction){
    let holdTimer = null;
    let holding = false;
    let scanning = false;

    function scanTick(delay){
      if (!holding) return;
      scanning = true;
      if (bandLock) {
        const target = realStepTarget(direction);
        if (target) { pendingRollDir = direction; render(target.freq, {silent:true}); }
      } else {
        if (showRealFreq) pendingRollDir = direction;
        else { freqReadout.classList.remove('flicker'); void freqReadout.offsetWidth; freqReadout.classList.add('flicker'); }
        render(seqStepTarget(direction).freq, {silent:true});
      }
      const nextDelay = Math.max(50, delay - 10);
      holdTimer = setTimeout(() => scanTick(nextDelay), nextDelay);
    }

    function start(e){
      if (holding) return;
      e.preventDefault();
      holding = true;
      scanning = false;
      btn.setPointerCapture?.(e.pointerId);
      holdTimer = setTimeout(() => scanTick(160), 300); // pause before auto-scan kicks in
    }

    function stop(){
      if (!holding) return;
      holding = false;
      clearTimeout(holdTimer);
      if (scanning) {
        render(currentFreq); // commit wherever the scan landed and start playing it
      } else {
        goToStationStep(direction); // short tap never entered scan mode
      }
    }

    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('pointerleave', stop);
  }

  bindHoldTune(prevStationBtn, -1);
  bindHoldTune(nextStationBtn, 1);

  // --- speakers: jump a whole group (block) of stations ---
  // Right speaker = next group, left = back (to the start of this group,
  // or the previous group if already there), wrapping round at either end
  // (Internet only -> Sport, and back). Lands on the group's first station.
  const groupBadge = document.getElementById('groupBadge');
  let groupBadgeTimer = null;

  function groupIndexFor(freq){
    let g = 0;
    for (let i = 0; i < STATION_GROUPS.length; i++) {
      if (STATION_GROUPS[i].start <= freq + 1e-9) g = i;
    }
    return g;
  }

  function flashGroupName(name){
    // The big display has room for a short name: "South Australia", not
    // "South Australia – music & community".
    groupBadge.textContent = String(name).split(' – ')[0];
    groupBadge.parentElement.classList.add('showing-group');
    clearTimeout(groupBadgeTimer);
    groupBadgeTimer = setTimeout(hideGroupName, 2500);
  }

  // Left works like "previous track" on a CD player: from partway through a
  // group it goes back to that group's first station; from the first
  // station it goes to the previous group.
  // Real frequency only: the speakers jump through the band in thirds (start,
  // 1/3, 2/3), like Android Auto's double arrows. Same "previous track" rule:
  // from partway through a third, back goes to that third's start first.
  function goToBandThird(direction){
    const cur = nearestStation(currentFreq);
    const band = realBandFor(cur).band;
    const list = realBandStations(band).filter(allowed);
    const n = list.length;
    if (!n) return;
    const parts = Math.min(3, n);
    const starts = []; for (let k = 0; k < parts; k++) starts.push(Math.floor(k * n / parts));
    const p = list.indexOf(cur);
    let s = 0;
    if (p >= 0) starts.forEach((st, k) => { if (st <= p) s = k; });
    const target = p < 0 ? 0 : (direction < 0 && p !== starts[s]) ? s : (((s + direction) % parts) + parts) % parts;
    const landing = list[starts[target]];
    pendingRollDir = direction;
    if (landing !== cur) render(landing.freq);
    flashGroupName(BAND_LABEL[band] + ' · ' + (parts > 1 ? ['START', '1/3', '2/3'][target] : 'START'));
  }

  function goToGroupStep(direction){
    if (realOnly) return goToBandThird(direction);
    setBandLock(false);   // the speakers go back to browsing by section
    if (showingList) return goToListSection(direction);
    const n = STATION_GROUPS.length;
    const here = groupIndexFor(currentFreq);
    // A section's first station (the first Australian one when AU only is
    // on); sections with none are skipped.
    const firstOf = g => {
      const lo = STATION_GROUPS[g].start - 1e-9;
      const hi = g + 1 < n ? STATION_GROUPS[g + 1].start - 1e-9 : Infinity;
      return byFreq.find(s => s.freq >= lo && s.freq < hi && allowed(s)) || null;
    };
    const first = firstOf(here);
    const atStart = !first || currentFreq <= first.freq + 0.001;
    let target = here;
    if (!(direction < 0 && !atStart)) {
      for (let k = 1; k <= n; k++) {
        target = (((here + direction * k) % n) + n) % n;
        if (firstOf(target)) break;
      }
    }
    const group = STATION_GROUPS[target];
    const landing = firstOf(target) || nearestStation(group.start);
    freqReadout.classList.remove('flicker'); void freqReadout.offsetWidth; freqReadout.classList.add('flicker');
    render(landing.freq);
    flashGroupName(group.name);
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
  }

  // With My phone stations on there are no categories: the group buttons jump
  // through the list in thirds (start, 1/3, 2/3, back to the start), in dial
  // order - the same as Android Auto. Same "previous track" rule as above:
  // from partway through a third, back goes to that third's start first.
  function goToListSection(direction){
    const list = byFreq.filter(s => inShowingList.has(s.name) && allowed(s));
    const n = list.length;
    if (!n) return;
    const parts = Math.min(3, n);
    const starts = []; for (let k = 0; k < parts; k++) starts.push(Math.floor(k * n / parts));
    const cur = nearestStation(currentFreq);
    const p = list.indexOf(cur);
    let s = 0;
    if (p >= 0) starts.forEach((st, k) => { if (st <= p) s = k; });
    const target = p < 0 ? 0 : (direction < 0 && p !== starts[s]) ? s : (((s + direction) % parts) + parts) % parts;
    const landing = list[starts[target]];
    freqReadout.classList.remove('flicker'); void freqReadout.offsetWidth; freqReadout.classList.add('flicker');
    render(landing.freq);
    flashGroupName(parts > 1 ? ['Start', '1/3', '2/3'][target] : 'Start');
    if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
  }

  [['speakerLeft', -1], ['speakerRight', 1]].forEach(([id, direction]) => {
    const speaker = document.getElementById(id);
    speaker.addEventListener('click', () => goToGroupStep(direction));
    speaker.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToGroupStep(direction); }
    });
  });

  // --- keyboard tuning ---
  document.addEventListener('keydown', e => {
    if (document.activeElement === volumeSlider) return; // let the slider handle its own arrows
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') {
      e.preventDefault();
      goToStationStep(1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') {
      e.preventDefault();
      goToStationStep(-1);
    } else if (e.key === 'PageUp') {
      e.preventDefault();
      goToGroupStep(1);
    } else if (e.key === 'PageDown') {
      e.preventDefault();
      goToGroupStep(-1);
    }
  });

  // --- commands the native Android shell can invoke (lock screen / notification / Bluetooth) ---
  // ---- Sleep timer: press and hold the RADIO WAVEHOPPER badge ----
  // Each hold steps 120 -> 60 -> 30 -> 10 minutes -> off. In the app the
  // countdown itself runs in the native player (page timers stop when the
  // screen is off); this page just shows it. On the website it runs here.
  const SLEEP_STEPS = [120, 60, 30, 10, 0];
  const SLEEP_MESSAGE_MS = 10000;   // how long a sleep message stays by the play button
  const SLEEP_WARNING_S = 30;       // final countdown, with the chance to extend
  const logoBadge = document.querySelector('.logo-badge');
  const sleepBadge = document.getElementById('sleepBadge');
  const nativeSleep = isNativeApp && typeof window.AndroidBridge.setSleepTimer === 'function';
  let sleepChoice = 0;      // minutes last chosen (0 = off)
  let sleepEndAt = 0;       // epoch ms when it stops, 0 = off
  let sleepTicker = null;
  let sleepMessage = '';    // the sleep text currently shown by the play button, if any
  let sleepMessageTimer = null;
  let statusBeforeSleep = null;

  // Show a sleep message by the play button. A temporary one goes back to
  // the normal "On air" (or paused) text after 10 seconds; the final
  // countdown stays until it ends or is extended.
  function showSleepMessage(text, cls, temporary){
    if (!sleepMessage || statusText.textContent !== sleepMessage) {
      statusBeforeSleep = { cls: statusText.className, text: statusText.textContent };
    }
    statusText.className = 'status-text ' + cls;
    statusText.textContent = text;
    sleepMessage = text;
    clearTimeout(sleepMessageTimer);
    if (temporary) sleepMessageTimer = setTimeout(clearSleepMessage, SLEEP_MESSAGE_MS);
  }

  function clearSleepMessage(){
    clearTimeout(sleepMessageTimer);
    // Only put things back if nothing else has changed the text since.
    if (sleepMessage && statusText.textContent === sleepMessage) {
      if (isPlaying && currentPlayingStation) {
        statusText.className = 'status-text ok';
        statusText.textContent = 'On air — ' + currentPlayingStation.name;
      } else if (statusBeforeSleep) {
        statusText.className = statusBeforeSleep.cls;
        statusText.textContent = statusBeforeSleep.text;
      }
    }
    sleepMessage = '';
  }

  function sleepSecondsLeft(){
    return sleepEndAt ? Math.max(0, Math.ceil((sleepEndAt - Date.now()) / 1000)) : 0;
  }
  function inFinalCountdown(){
    const left = sleepSecondsLeft();
    return left > 0 && left <= SLEEP_WARNING_S;
  }

  function showSleepTimer(){
    const left = sleepSecondsLeft();
    if (!left) {
      sleepBadge.hidden = true;
      logoBadge.setAttribute('aria-label', 'Sleep timer off. Press and hold to set');
      return;
    }
    sleepBadge.hidden = false;
    sleepBadge.textContent = left < 60 ? 'SLEEP 0:' + String(left).padStart(2, '0')
                                       : 'SLEEP ' + Math.ceil(left / 60);
    logoBadge.setAttribute('aria-label',
      `Sleep timer: ${left < 60 ? left + ' seconds' : Math.ceil(left / 60) + ' minutes'} left. Press and hold to change`);
    if (left <= SLEEP_WARNING_S) {
      showSleepMessage(`Sleeping in ${left}s. Hold the badge to extend.`, 'warn', false);
    }
  }

  function sleepTimerEnded(){
    sleepEndAt = 0; sleepChoice = 0;
    clearInterval(sleepTicker); sleepTicker = null;
    try { localStorage.removeItem('sleep_end_at'); } catch (e) {}
    showSleepTimer();
  }

  // Ticks every second: cheap, and makes the final countdown smooth.
  function startSleepTicker(){
    clearInterval(sleepTicker);
    sleepTicker = setInterval(() => {
      if (sleepEndAt && Date.now() >= sleepEndAt) {
        sleepTimerEnded();
        if (!nativeSleep) {
          // Website only: the app's native player stops itself and says so.
          if (isPlaying) stopAudio();
          showSleepMessage('Sleep timer: goodnight. Press play to resume.', '', false);
        }
      } else {
        showSleepTimer();
      }
    }, 1000);
  }

  function setSleepTimer(minutes){
    sleepChoice = minutes;
    sleepEndAt = minutes ? Date.now() + minutes * 60000 : 0;
    if (nativeSleep) { try { window.AndroidBridge.setSleepTimer(minutes); } catch (e) {} }
    else { try { localStorage.setItem('sleep_end_at', String(sleepEndAt)); } catch (e) {} }
    if (minutes) startSleepTicker(); else { clearInterval(sleepTicker); sleepTicker = null; }
    showSleepTimer();
    showSleepMessage(minutes ? `Sleep timer: ${minutes} min. Hold the badge again to change.`
                             : 'Sleep timer off.', 'ok', true);
  }

  // Website only (the app's own player does this itself, so it also covers
  // the widget and notification): start the default sleep timer from
  // Settings when playing starts and no timer is running.
  function startDefaultSleep(){
    if (nativeSleep) return;
    const m = userData.sleepDefault || 0;
    if (!m || sleepEndAt > Date.now()) return;
    setSleepTimer(m);
  }

  function stepSleepTimer(){
    // In the final countdown a hold is an extension, so start again from the
    // longest setting (120, then 60, 30, 10) rather than stepping to "off".
    const from = inFinalCountdown() ? 0 : sleepChoice;
    const next = SLEEP_STEPS[(SLEEP_STEPS.indexOf(from) + 1) % SLEEP_STEPS.length];
    setSleepTimer(next);
    if (navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
  }

  // Restore a timer that's still running (app reopened, or page reloaded).
  try {
    const savedEnd = nativeSleep ? Number(window.AndroidBridge.getSleepTimerEnd())
                                 : Number(localStorage.getItem('sleep_end_at') || 0);
    if (savedEnd > Date.now()) {
      sleepEndAt = savedEnd;
      const minsLeft = (savedEnd - Date.now()) / 60000;
      sleepChoice = SLEEP_STEPS.find(m => m && m >= minsLeft) || 120;
      startSleepTicker();
    }
  } catch (e) {}
  showSleepTimer();

  let sleepHold = null;
  logoBadge.addEventListener('pointerdown', () => {
    logoBadge.classList.add('holding');
    clearTimeout(sleepHold);
    sleepHold = setTimeout(() => { sleepHold = null; logoBadge.classList.remove('holding'); stepSleepTimer(); }, 600);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => logoBadge.addEventListener(ev, () => {
    clearTimeout(sleepHold); sleepHold = null; logoBadge.classList.remove('holding');
  }));
  logoBadge.addEventListener('contextmenu', e => e.preventDefault());
  logoBadge.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); stepSleepTimer(); }
  });

  window.NativeControls = {
    onSleepTimerCancelled: function(){
      sleepTimerEnded();
      showSleepMessage('Sleep timer cancelled: Android Auto took over.', '', true);
    },
    // The app started your default sleep timer (Settings) as play began.
    onSleepTimerStarted: function(endAt, minutes){
      sleepEndAt = Number(endAt) || 0;
      sleepChoice = minutes;
      if (sleepEndAt) startSleepTicker();
      showSleepTimer();
      if (sleepEndAt) showSleepMessage(`Sleep timer: ${minutes} min (your default). Hold the badge to change.`, 'ok', true);
    },
    // A default sleep timer ended because the radio was paused.
    onSleepTimerOff: function(){
      sleepTimerEnded();
    },
    onSleepTimerFinished: function(){
      sleepTimerEnded();
      showSleepMessage('Sleep timer: goodnight. Press play to resume.', '', false);
    },
    // Next/Previous still ask this page which station comes next (it owns
    // the dial-stepping logic) - goToStationStep() -> render() -> playStation()
    // then tells native which one to actually play.
    next: function(){ goToStationStep(1, true); },
    // The phone's media volume changed (buttons, system panel, or this
    // slider). Ignored while the slider is being dragged, so the native
    // echo of the drag doesn't snap the thumb out from under the finger.
    onVolumeChanged: function(level){
      if (Date.now() - lastVolumeInputAt < 500) return;
      volumeSlider.value = level;
    },
    prev: function(){ goToStationStep(-1, true); },

    // PlaybackService's own ExoPlayer is what's actually playing now (lock
    // screen Play/Pause taps go straight to it, not through this page) -
    // these three are it reporting the real outcome back, so the UI
    // reflects what's actually happening rather than what was merely asked
    // for.
    // The app's player read a song title from the stream it's playing.
    onNativeTrack: function(artist, title){
      if (!title || !currentPlayingStation) return;
      nativeTitleStation = currentPlayingStation;
      setNowPlaying(artist ? artist + ' — ' + title : title);
      fetchAlbumArt(artist, title);
    },
    onNativePlaying: function(){
      isLoading = false;
      isPlaying = true;
      eqBars.classList.add('playing');
      playIcon.innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
      statusText.className = 'status-text ok';
      statusText.textContent = 'On air — ' + (currentPlayingStation ? currentPlayingStation.name : '');
      updateMediaSessionState();
      identifyBtn.style.display = '';
    },
    onNativePaused: function(){
      isLoading = false;
      isPlaying = false;
      eqBars.classList.remove('playing');
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      statusText.className = 'status-text';
      statusText.textContent = 'Paused. Press play to resume.';
      updateMediaSessionState();
    },
    onNativeError: function(reason){
      isLoading = false;
      isPlaying = false;
      eqBars.classList.remove('playing');
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      statusText.className = 'status-text warn';
      const reasonSuffix = reason ? ' (' + reason + ')' : '';
      const url = currentPlayingStation ? currentPlayingStation.url : '';
      statusText.innerHTML = 'Couldn\'t play this' + reasonSuffix + '.' +
        (url ? ' <a href="' + url + '" target="_blank" rel="noopener">Open the stream directly ↗</a>' : '');
      updateMediaSessionState();
      if (icyAbortController) { icyAbortController.abort(); icyAbortController = null; }
      if (metadataPollTimer) { clearInterval(metadataPollTimer); metadataPollTimer = null; }
    }
  };

  let initialStationName = "";
  let shouldPlay = false;
  if (window.AndroidBridge) {
    try {
      if (window.AndroidBridge.getSavedStation) initialStationName = window.AndroidBridge.getSavedStation();
      if (window.AndroidBridge.isPlaying) shouldPlay = window.AndroidBridge.isPlaying();
    } catch (e) {}
  }

  // With a list on (or categories hidden), open on the first station showing.
  const openingFreq = stations.length === allStations.length ? 90.3 : stations[0].freq;
  if (initialStationName) {
    const found = stations.find(s => s.name === initialStationName || initialStationName.includes(s.name));
    if (found) {
      render(found.freq, {initial: !shouldPlay});
    } else {
      render(openingFreq, {initial:true});
    }
  } else {
    render(openingFreq, {initial:true});
  }
  window.__wh = { stations: allStations, STATION_GROUPS, DAB_BLOCKS, LEGACY_KEY_NAMES, userData, twoLists, PHONE_LIST, CAR_LIST, realOnly, getBandLock: () => bandLock, getCurrentFreq: () => currentFreq };
  // Closing the Edit screen reloads the page; keep Band Lock on across that one reload.
  try {
    if (sessionStorage.getItem('wh_keep_lock') === '1') { sessionStorage.removeItem('wh_keep_lock'); setBandLock(true); }
  } catch (e) {}
})();
</script>

<script>
// Edit screen (pencil, top right): add your own stations. Stage 1 = Add.
// Saved on the phone only: the app's own storage via AndroidBridge, or the
// browser's localStorage on the plain website. Saving does not touch the
// built-in list; the page and the phone player merge the two.
(function(){
  const wh = window.__wh;
  if (!wh) return;
  const { stations, STATION_GROUPS, DAB_BLOCKS, LEGACY_KEY_NAMES, userData, twoLists, PHONE_LIST, CAR_LIST } = wh;
  const KEY = 'user_stations_v1';
  const native = !!(window.AndroidBridge && window.AndroidBridge.saveUserStations);
  let dirty = false, testing = false, testAudio = null;
  let editing = null;   // the station being edited, or null when adding

  const REGION_FOR_GROUP = {
    'NSW (and ACT) – music & community':'NSW', 'Victoria – music & community':'VIC', 'Queensland – music & community':'QLD', 'South Australia – music & community':'SA',
    'Western Australia – music & community':'WA', 'Tasmania – music & community':'TAS', 'Northern Territory – music & community':'NT',
    'Australia (national)':'AU', 'New Zealand':'NZ', 'Singapore':'SG', 'South Africa':'ZA',
    'UK':'UK', 'France':'FR', 'Germany':'DE', 'USA':'US'
  };
  const REGIONS = [['AU','Australia (national)'],['NSW','NSW'],['ACT','ACT'],['VIC','Victoria'],['QLD','Queensland'],
    ['SA','South Australia'],['WA','Western Australia'],['TAS','Tasmania'],['NT','Northern Territory'],
    ['NZ','New Zealand'],['NC','New Caledonia'],['FJ','Fiji'],['SG','Singapore'],['ZA','South Africa'],
    ['UK','United Kingdom'],['IE','Ireland'],['FR','France'],['DE','Germany'],['US','USA'],['CA','Canada'],['XX','Other']];
  const GROUP_END_LAST = 102.10;

  // ---- dial slot ----------------------------------------------------
  const groupOf = f => { let g = 0; STATION_GROUPS.forEach((s, i) => { if (s.start <= f + 1e-9) g = i; }); return g; };
  const groupEnd = g => g + 1 < STATION_GROUPS.length ? STATION_GROUPS[g + 1].start : GROUP_END_LAST;
  // Same order the built-in list uses inside a group: AM, FM, DAB, Internet, by real frequency.
  function orderKey(s){
    const r = s.real || '';
    let m;
    const nm = (s.name || '').toLowerCase();   // only breaks ties between equal frequencies
    if ((m = /^([\d.]+)\s*AM$/i.exec(r))) return [0, parseFloat(m[1]), nm];
    if ((m = /^([\d.]+)\s*FM$/i.exec(r))) return [1, parseFloat(m[1]), nm];
    if (/^DAB/i.test(r)) return [2, DAB_BLOCKS && DAB_BLOCKS[s.dab] ? DAB_BLOCKS[s.dab] : 0, nm];
    return [3, 0, nm];

  // Adds a station to My phone stations or My car stations (making the list

  function addToList(name, rec){
    let l = userData.lists.find(x => x.name === name);
    if (!l) { l = { name, stations: [], sort: 'freq', groups: [] }; userData.lists.push(l); }
    if (l.stations.includes(rec.name)) return;
    const order = new Map(stations.concat([rec]).slice().sort((a, b) => a.freq - b.freq).map((st, i) => [st.name, i]));

  }

  function saveEdit(rec, msg){
    const st = editing, oldName = st.name;

      if (i < 0) return setMsg(msg, 'Could not find that station.', 'warn');
      const old = userData.added[i]; userData.added[i] = rec;
      if (!persist()) { userData.added[i] = old; return setMsg(msg, 'Could not save. Try again.', 'warn'); }

      if (!rec.dab) delete st.dab;
      if (!rec.hls) delete st.hls;
    } else {
      const k = keyOf(st);
      const old = userData.edited[k];
      const e = { name: rec.name, real: rec.real, cc: rec.cc, url: rec.url };
      if (rec.dab) e.dab = rec.dab;
      if (Math.abs(rec.freq - parseFloat(k)) > 1e-6) e.freq = rec.freq;
      userData.edited[k] = e;
      userData.names[k] = st._orig || st.name;
      if (!persist()) { if (old) userData.edited[k] = old; else delete userData.edited[k]; return setMsg(msg, 'Could not save. Try again.', 'warn'); }

    renderShowing();
  });
  $('edPickP').addEventListener('click', () => openPicker(PHONE_LIST, false));
  $('edPickC').addEventListener('click', () => openPicker(CAR_LIST, false));
  $('edListCancel').addEventListener('click', () => { closePicker(); showMsg(''); renderShowing(); });
  $('edListFind').addEventListener('input', renderPick);
  $('edListSave').addEventListener('click', () => {
    const name = listEditing; if (!name) return;
    const forCar = name === CAR_LIST;
    const picked = JSON.parse($('edListPick').dataset.keep || '[]');
    const before = JSON.stringify([userData.lists, userData.activeList, userData.carList]);
    const others = userData.lists.filter(l => l.name !== name);
    if (!picked.length) {
      // Nothing ticked: the list goes, and that side shows all stations again.
      userData.lists = others;
      if (forCar && userData.carList === CAR_LIST) userData.carList = '';
      if (!forCar && userData.activeList === PHONE_LIST) userData.activeList = '';
    } else {
      const order = new Map(stations.slice().sort((a, b) => a.freq - b.freq).map((st, i) => [st.name, i]));   // kept in dial order
      const rec = { name, stations: picked.slice().sort((a, b) => (order.get(a) ?? 1e9) - (order.get(b) ?? 1e9)), sort: $('edListSort').value === 'az' ? 'az' : 'freq', groups: [] };
      userData.lists = (forCar ? others.concat([rec]) : [rec].concat(others));
      if (switchOnSave) { if (forCar) userData.carList = CAR_LIST; else userData.activeList = PHONE_LIST; }
    }
    closePicker();
    if (!persist()) { const b = JSON.parse(before); userData.lists = b[0]; userData.activeList = b[1]; userData.carList = b[2]; renderShowing(); return showMsg('Could not save. Try again.', 'warn'); }
    saveShowing(!picked.length ? 'Cleared ' + shownName(name) + '; it shows all stations.' : 'Saved ' + shownName(name) + ' (' + picked.length + ' station' + (picked.length === 1 ? '' : 's') + ').', forCar);
  });

  // ---- default sleep timer ---------------------------------------------
  function renderSleep(){
    const m = userData.sleepDefault || 0;
    $('edSleep').value = String(m);
    $('sumSleep').textContent = m ? 'Default: ' + m + ' minutes' : 'Default: off';
  }
  $('edSleep').addEventListener('change', () => {
    const before = userData.sleepDefault || 0;
    const m = Number($('edSleep').value) || 0;
    userData.sleepDefault = [10, 30, 60, 120].includes(m) ? m : 0;
    if (!persist()) {
      userData.sleepDefault = before; renderSleep();
      return setMsg($('edSleepMsg'), 'Could not save. Try again.', 'warn');
    }
    renderSleep();
    setMsg($('edSleepMsg'), userData.sleepDefault ? 'Saved. It starts the next time the radio plays.' : 'Default sleep is off.', 'ok');
  });

  let resetArmed = false, resetTimer = null;
  $('edReset').addEventListener('click', () => {
    const m = $('edResetMsg');
    if (!resetArmed) {
      resetArmed = true; $('edReset').textContent = 'TAP AGAIN TO RESET';
      setMsg(m, 'This puts back every built-in station and removes the ones you added or edited, your custom logos, the stations chosen for the phone and car, and default sleep.', 'warn');
      resetTimer = setTimeout(() => { resetArmed = false; $('edReset').textContent = 'RESET TO DEFAULTS'; setMsg(m, ''); }, 5000);
      return;
    }
    clearTimeout(resetTimer);
    try { if (native && window.AndroidBridge.clearUserLogo) stations.forEach(st => window.AndroidBridge.clearUserLogo(st.name)); } catch (e) {}
    userData.added = []; userData.hidden = []; userData.edited = {}; userData.names = {};
    userData.hiddenGroups = []; userData.lists = []; userData.activeList = ''; userData.carList = '';
    userData.sleepDefault = 0;
    userData.realOnly = true;
    if (!persist()) return setMsg(m, 'Could not reset. Try again.', 'warn');
    stopTest(); dirty = false;
    try { if (wh.getBandLock()) sessionStorage.setItem('wh_keep_lock', '1'); } catch (e) {}
    location.reload();
  });


  // ---- backup: export and import -------------------------------------
  // One small .json file: the stations you added, the built-ins you removed or
  // edited, and your custom logos. Import replaces what is on the phone now.
  const REAL_OK = /^(\d{1,4}(\.\d{1,3})? (AM|FM)|DAB only|Internet only)$/;
  const str = (v, max) => typeof v === 'string' && v.length <= max;
  function buildBackup(){
    const logos = {};
    if (native && window.AndroidBridge.getUserLogo) {
      const names = new Set(stations.map(s => s.name));
      names.forEach(n => { try { const d = window.AndroidBridge.getUserLogo(n); if (d) logos[n] = d; } catch (e) {} });
    }
    return JSON.stringify({ app: 'Radio Wavehopper', format: 1, exported: new Date().toISOString(),
      added: userData.added, hidden: userData.hidden, edited: userData.edited, names: userData.names,
      lists: userData.lists, activeList: userData.activeList, carList: userData.carList, sleepDefault: userData.sleepDefault || 0, realOnly: userData.realOnly !== false, logos });
  }
  window.__whBackupError = m => setMsg($('edBackupMsg'), m, 'warn');
  window.__whBackupDone = (ok, msg) => setMsg($('edBackupMsg'), msg || '', ok ? 'ok' : (msg ? 'warn' : ''));
  function doExport(mode){
    const m = $('edBackupMsg');
    if (!userData.added.length && !userData.hidden.length && !Object.keys(userData.edited).length
        && !userData.lists.length && !userData.sleepDefault) {
      let any = false;
      if (native && window.AndroidBridge.getUserLogo) stations.forEach(s => { try { if (window.AndroidBridge.getUserLogo(s.name)) any = true; } catch (e) {} });
      if (!any) return setMsg(m, 'Nothing to back up yet: you have not added, edited or removed anything.', 'warn');
    }
    const json = buildBackup();
    if (native && mode === 'share' && window.AndroidBridge.shareBackup) { window.AndroidBridge.shareBackup(json); setMsg(m, 'Choose where to send the backup.', 'ok'); return; }
    if (native && window.AndroidBridge.saveBackup) { window.AndroidBridge.saveBackup(json); return; }
    try {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      a.download = 'radiowavehopper-backup.json';
      document.body.appendChild(a); a.click(); a.remove();
      setMsg(m, 'Backup downloaded.', 'ok');
    } catch (e) { setMsg(m, 'Could not create the backup.', 'warn'); }
  }
  // One button: Android's share menu also offers saving to Files or Drive.
  $('edExport').addEventListener('click', () => doExport(native && window.AndroidBridge.shareBackup ? 'share' : 'save'));

  let pendingImport = null;
  // Checks a backup and keeps only what is safe and fits the dial.
  function cleanBackup(d){
    if (!d || typeof d !== 'object' || d.app !== 'Radio Wavehopper') return null;
    const builtIn = new Set(stations.filter(x => !x.user).map(x => x._key));
    userData.hidden.forEach(k => builtIn.add(k));
    // A backup made by an older version may file a built-in under a key that has
    // since moved: find the station by its name and use its current key.
    const byName = {}; stations.forEach(x => { if (!x.user && x._orig && !(x._orig in byName)) byName[x._orig] = x._key; });
    const bNames = (d.names && typeof d.names === 'object' && !Array.isArray(d.names)) ? d.names : {};
    const names = {};
    const keyFor = k => {
      const want = bNames[k] || LEGACY_KEY_NAMES[k];
      const cur = stations.find(x => !x.user && x._key === k);
      if (want && !(cur && cur._orig === want)) return byName[want] || '';
      if (cur && !want) names[k] = cur._orig;
      if (want && cur) names[k] = want;
      return k;
    };
    const hid0 = (Array.isArray(d.hidden) ? d.hidden : []).filter(k => typeof k === 'string').map(k => { const k2 = keyFor(k); if (k2 && k2 !== k) names[k2] = bNames[k] || LEGACY_KEY_NAMES[k]; return k2; }).filter(Boolean);
    const edit0 = {};
    if (d.edited && typeof d.edited === 'object' && !Array.isArray(d.edited)) {
      Object.keys(d.edited).forEach(k => {
        const k2 = keyFor(k); if (!k2) return;
        if (k2 !== k) names[k2] = bNames[k] || LEGACY_KEY_NAMES[k];
        const e = Object.assign({}, d.edited[k]);
        const tgt = stations.find(x => !x.user && x._key === k2);
        if (tgt && typeof e.freq === 'number' && Math.abs(e.freq - tgt.freq) < 1e-6) delete e.freq;
        edit0[k2] = e;
      });
    }
    d = Object.assign({}, d, { hidden: hid0, edited: edit0 });
    const hidden = hid0.filter(k => typeof k === 'string' && builtIn.has(k));
    const hiddenSet = new Set(hidden);
    const used = new Set(); builtIn.forEach(k => { if (!hiddenSet.has(k)) used.add(k); });
    const added = []; let dropped = 0;
    // Built-in stations moved to another slot: free the old slot, claim the new one.
    const movedTo = {};
    if (d.edited && typeof d.edited === 'object' && !Array.isArray(d.edited)) {
      Object.keys(d.edited).forEach(k => {
        const e = d.edited[k];
        if (!e || typeof e.freq !== 'number' || !isFinite(e.freq) || !builtIn.has(k) || hiddenSet.has(k) || startKeys.has(k)) return;
        const k2 = (Math.round(e.freq * 100) / 100).toFixed(2);
        if (e.freq > 87.5 && e.freq < 102.1 && !startKeys.has(k2) && !used.has(k2)) { used.delete(k); used.add(k2); movedTo[k] = Math.round(e.freq * 100) / 100; }
      });
    }
    (Array.isArray(d.added) ? d.added : []).forEach(u => {
      const ok = u && str(u.name, 40) && u.name.trim() && /^https?:\/\/\S+$/i.test(u.url || '') && str(u.real, 20) && REAL_OK.test(u.real)
        && typeof u.freq === 'number' && isFinite(u.freq) && u.freq >= 87.5 && u.freq < 102.1 && str(u.cc || '', 3)
        && (u.dab === undefined || (typeof u.dab === 'string' && DAB_BLOCKS && DAB_BLOCKS[u.dab]));
      const k = ok ? (Math.round(u.freq * 100) / 100).toFixed(2) : '';
      if (!ok) { dropped++; return; }          // a clash is fine: the merge re-places it when the dial reloads
      used.add(k);
      const rec = { freq: Math.round(u.freq * 100) / 100, name: u.name.trim(), real: u.real, cc: u.cc || '', url: u.url };
      if (u.dab) rec.dab = u.dab;
      if (/\.m3u8(\?|$)/i.test(u.url)) rec.hls = true;
      added.push(rec);
    });
    const edited = {};
    if (d.edited && typeof d.edited === 'object' && !Array.isArray(d.edited)) {
      Object.keys(d.edited).forEach(k => {
        const e = d.edited[k];
        if (!builtIn.has(k) || hiddenSet.has(k) || !e || !str(e.name, 40) || !e.name.trim() || !/^https?:\/\/\S+$/i.test(e.url || '') || !str(e.real, 20) || !REAL_OK.test(e.real) || !str(e.cc || '', 3)) { dropped++; return; }
        const o = { name: e.name.trim(), real: e.real, cc: e.cc || '', url: e.url };
        if (movedTo[k] !== undefined) o.freq = movedTo[k];
        if (e.dab && DAB_BLOCKS && DAB_BLOCKS[e.dab]) o.dab = e.dab;
        edited[k] = o;
      });
    }
    const logos = {};
    if (d.logos && typeof d.logos === 'object') {
      Object.keys(d.logos).forEach(n => { const v = d.logos[n]; if (str(n, 60) && typeof v === 'string' && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+\/=]+$/.test(v) && v.length < 3000000) logos[n] = v; });
    }
    const keptNames = {}; hidden.concat(Object.keys(edited)).forEach(k => { if (names[k]) keptNames[k] = names[k]; });
    const lists0 = [];
    (Array.isArray(d.lists) ? d.lists : []).forEach(l => {
      if (!l || !str(l.name, 30) || !l.name.trim() || !Array.isArray(l.stations)) return;
      if (lists0.some(x => x.name.toLowerCase() === l.name.trim().toLowerCase())) return;
      lists0.push({ name: l.name.trim(), stations: l.stations.filter(n => str(n, 60)).slice(0, 500), sort: l.sort });
    });
    // Backups from older versions (several lists) become the two lists, the same way as on start-up.
    const two = twoLists(lists0, d.activeList, d.carList);
    const sleepDefault = [10, 30, 60, 120].includes(d.sleepDefault) ? d.sleepDefault : 0;
    return { added, hidden, edited, names: keptNames, lists: two.lists, activeList: two.activeList, carList: two.carList, sleepDefault, realOnly: d.realOnly !== false, logos, dropped };
  }
  function handleImportText(text){
    const m = $('edBackupMsg');
    let d; try { d = JSON.parse(text); } catch (e) { return setMsg(m, 'That is not a Radio Wavehopper backup file.', 'warn'); }
    const c = cleanBackup(d);
    if (!c) return setMsg(m, 'That is not a Radio Wavehopper backup file.', 'warn');
    pendingImport = c;
    $('edImportGoRow').hidden = false;
    setMsg(m, 'Backup: ' + c.added.length + ' added, ' + Object.keys(c.edited).length + ' edited, ' + c.hidden.length + ' removed, ' + Object.keys(c.logos).length + ' logos'
      + c.lists.map(l => ', ' + (l.name === CAR_LIST ? 'car' : 'phone') + ' chosen stations (' + l.stations.length + ')').join('')
      + (c.sleepDefault ? ', default sleep ' + c.sleepDefault + ' min' : '')
      + (c.dropped ? ' (' + c.dropped + ' skipped: they did not fit the dial)' : '') + '. Replace what is on this phone now?', 'warn');
  }
  window.__whImportResult = function(ok, text){
    if (!ok) { setMsg($('edBackupMsg'), text || '', text ? 'warn' : ''); return; }
    handleImportText(text);
  };
  $('edImport').addEventListener('click', () => {
    $('edImportGoRow').hidden = true; pendingImport = null; setMsg($('edBackupMsg'), '');
    if (native && window.AndroidBridge.pickBackup) { window.AndroidBridge.pickBackup(); return; }
    $('edImportFile').value = ''; $('edImportFile').click();
  });
  $('edImportFile').addEventListener('change', () => {
    const f = $('edImportFile').files && $('edImportFile').files[0];
    if (!f) return;
    const r = new FileReader(); r.onload = () => handleImportText(String(r.result)); r.onerror = () => setMsg($('edBackupMsg'), 'That file could not be read.', 'warn');
    r.readAsText(f);
  });
  $('edImportNo').addEventListener('click', () => { pendingImport = null; $('edImportGoRow').hidden = true; setMsg($('edBackupMsg'), ''); });
  $('edImportGo').addEventListener('click', () => {
    const c = pendingImport; if (!c) return;
    const m = $('edBackupMsg');
    const before = JSON.stringify(userData);
    // Clear the current custom logos first, then restore the backup's.
    const oldNames = stations.map(s => s.name);
    userData.added = c.added; userData.hidden = c.hidden; userData.edited = c.edited; userData.names = c.names;
    userData.hiddenGroups = []; userData.lists = c.lists; userData.activeList = c.activeList; userData.carList = c.carList;
    userData.sleepDefault = c.sleepDefault;
    userData.realOnly = c.realOnly;
    if (!persist()) { Object.assign(userData, JSON.parse(before)); return setMsg(m, 'Could not import. Nothing was changed.', 'warn'); }
    if (native) {
      try {
        const b = window.AndroidBridge;
        oldNames.forEach(n => b.clearUserLogo(n));
        Object.keys(c.logos).forEach(n => b.saveUserLogo(n, c.logos[n]));
      } catch (e) {}
    }
    pendingImport = null; dirty = false; stopTest();
    try { if (wh.getBandLock()) sessionStorage.setItem('wh_keep_lock', '1'); } catch (e) {}
    location.reload();
  });

  function openEdit(){
    scr.hidden = false; scr.scrollTop = 0;
    if (!gSel.dataset.init) { gSel.dataset.init = '1'; gSel.value = '0'; rSel.value = 'AU'; }
    updateRegionVisibility();
    exitEdit(); setMsg($('edMsg'), ''); setMsg($('edTestMsg'), ''); setMsg($('edBackupMsg'), ''); $('edImportGoRow').hidden = true; pendingImport = null;
    resetLogoUi('');
    refreshBand(); renderList();
    closePicker(); renderShowing(); renderSleep(); showMsg(''); setMsg($('edSleepMsg'), '');
    // Every section starts closed; the summaries say what each one is set to.
    scr.querySelectorAll('details').forEach(d => { d.open = false; });
  }
  function closeEdit(){
    stopTest(); exitEdit(); scr.hidden = true;
    if (dirty) {
      dirty = false;
      try { if (wh.getBandLock()) sessionStorage.setItem('wh_keep_lock', '1'); } catch (e) {}
      location.reload();
    }
  }
  btn.addEventListener('click', openEdit);
  $('edClose').addEventListener('click', closeEdit);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !scr.hidden) closeEdit(); });
  // Android back button / gesture closes the screen rather than leaving the app.
  window.__whEditOpen = () => !scr.hidden;
  window.__whEditClose = closeEdit;
})();
</script>
</body>
</html>
